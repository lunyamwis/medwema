<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Medwema{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --mw-primary: #2563eb;
      --mw-primary-dark: #1e3a8a;
      --mw-accent: #0284c7;
      --mw-dark: #0f172a;
    }
    * { font-family: 'Inter', sans-serif; }
    body { background: #f1f5f9; }

    /* ── Split-screen layout ── */
    .auth-panel-left {
      background: linear-gradient(160deg, #0f172a 0%, #1e3a8a 55%, #2563eb 100%);
      min-height: 100vh;
      position: relative;
      overflow: hidden;
    }
    .auth-panel-left::before {
      content: '';
      position: absolute;
      width: 400px; height: 400px;
      background: rgba(255,255,255,.04);
      border-radius: 50%;
      top: -100px; right: -100px;
    }
    .auth-panel-left::after {
      content: '';
      position: absolute;
      width: 250px; height: 250px;
      background: rgba(255,255,255,.03);
      border-radius: 50%;
      bottom: 60px; left: -60px;
    }
    .auth-panel-right {
      min-height: 100vh;
      background: #fff;
      overflow-y: auto;
    }

    /* ── Centered card layout ── */
    .auth-page-wrap {
      min-height: 100vh;
      background: linear-gradient(135deg, #eff6ff 0%, #e0f2fe 100%);
      display: flex;
      flex-direction: column;
    }
    .auth-card {
      background: #fff;
      border-radius: 20px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 8px 32px rgba(37,99,235,.08);
    }

    /* ── Form controls ── */
    .form-control-auth {
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      padding: .625rem 1rem;
      font-size: .9375rem;
      color: #1e293b;
      transition: border-color .2s, box-shadow .2s;
      background: #f8fafc;
    }
    .form-control-auth:focus {
      border-color: var(--mw-primary);
      box-shadow: 0 0 0 3px rgba(37,99,235,.12);
      background: #fff;
      outline: none;
    }
    .form-control-auth.is-invalid {
      border-color: #ef4444;
      background: #fff5f5;
    }
    .form-control-auth.is-invalid:focus {
      box-shadow: 0 0 0 3px rgba(239,68,68,.1);
    }

    /* ── Buttons ── */
    .btn-auth-primary {
      background: linear-gradient(90deg, var(--mw-primary), var(--mw-accent));
      border: none;
      border-radius: 10px;
      color: #fff;
      font-weight: 600;
      letter-spacing: .02em;
      padding: .7rem 1.5rem;
      font-size: .9375rem;
      transition: opacity .2s, transform .15s, box-shadow .2s;
    }
    .btn-auth-primary:hover {
      opacity: .92;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(37,99,235,.3);
      color: #fff;
    }
    .btn-auth-primary:active { transform: translateY(0); }

    /* ── Error states ── */
    .auth-error-alert {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 10px;
      color: #991b1b;
      font-size: .875rem;
      padding: .75rem 1rem;
    }
    .field-error {
      color: #dc2626;
      font-size: .8125rem;
      margin-top: .3rem;
      display: flex;
      align-items: center;
      gap: .25rem;
    }

    /* ── Left panel features ── */
    .auth-feature-item { display: flex; align-items: flex-start; gap: .75rem; padding: .4rem 0; }
    .auth-feature-icon {
      background: rgba(255,255,255,.14);
      border-radius: 8px;
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      font-size: 1rem;
    }

    /* ── Toggle password button ── */
    .pwd-toggle {
      position: absolute;
      right: .5rem; top: 50%; transform: translateY(-50%);
      border: none; background: transparent;
      color: #94a3b8; padding: .25rem .4rem;
      cursor: pointer;
    }
    .pwd-toggle:hover { color: #475569; }

    /* ── Divider ── */
    .auth-divider {
      display: flex; align-items: center; gap: 1rem;
      color: #94a3b8; font-size: .8125rem; margin: 1.25rem 0;
    }
    .auth-divider::before, .auth-divider::after {
      content: ''; flex: 1; border-top: 1px solid #e2e8f0;
    }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>

{% block body %}
{# Default: centered card layout used by all simple auth pages #}
<div class="auth-page-wrap">
  <div class="text-center py-4">
    <a href="/" class="text-decoration-none d-inline-flex align-items-center gap-2">
      <div style="background:#2563eb;border-radius:10px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;">
        <i class="bi bi-hospital text-white"></i>
      </div>
      <span class="fw-bold fs-5" style="color:#0f172a;">Medwema</span>
    </a>
  </div>
  <div class="flex-grow-1 d-flex align-items-start justify-content-center px-3 pb-5 pt-2">
    <div class="auth-card p-4 p-md-5" style="width:100%;max-width:500px;">
      {% block content %}{% endblock %}
    </div>
  </div>
  <footer class="text-center py-3" style="font-size:.8125rem;color:#94a3b8;">
    &copy; {% now "Y" %} Medwema &middot;
    <a href="/" style="color:#2563eb;text-decoration:none;">Home</a> &middot;
    <a href="{% url 'blog_list' %}" style="color:#2563eb;text-decoration:none;">Blog</a>
  </footer>
</div>
{% endblock %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script>
function togglePassword(inputId, iconId) {
  const inp = document.getElementById(inputId);
  const icon = document.getElementById(iconId);
  if (inp.type === 'password') {
    inp.type = 'text';
    icon.className = 'bi bi-eye-slash';
  } else {
    inp.type = 'password';
    icon.className = 'bi bi-eye';
  }
}
</script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
